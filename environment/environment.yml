# Conda environment for the anikin analysis scripts.
#
# Covers S1-S9, S10A and S11-S18. S10B and S10C require a separate environment
# (see environment/requirements_GEM.txt).
#
# Package versions are pinned to those used in this study so that results are
# reproducible. Fixed random seeds guarantee identical output only within a
# given scikit-learn version; the pin is therefore required, not optional.
#
# Create:  conda env create -f environment/environment.yml
# Activate: conda activate anikin
#
# cobra 0.29.1 is installed via pip and is used by S10A only. S10B and S10C
# require cobra 0.26.0 and a separate environment: see
# environment/requirements_GEM.txt.

name: anikin

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.12
  - pandas=2.2.2
  - numpy=2.0.2
  - biopython=1.83
  - scikit-learn=1.6.1
  - scipy=1.18.0
  - matplotlib=3.10.0
  - seaborn=0.13.2
  - networkx=3.6.1
  - openpyxl=3.1.5
  - xlsxwriter=3.2.9
  - plotly=5.24.1
  - joblib=1.5.3
  - pip
  - pip:
      - kaleido==1.2.0
      - cobra==0.29.1
