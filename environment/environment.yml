# Conda environment for the anikin analysis scripts.
#
# Covers every Python script except S11B and S11C, which require a separate
# environment (see environment/requirements_GEM.txt).
#
# Package versions are pinned to those used in this study so that results are
# reproducible. Fixed random seeds guarantee identical output only within a
# given scikit-learn version; the pin is therefore required, not optional
# (this applies in particular to S18).
#
# Create:   conda env create -f environment/environment.yml
# Activate: conda activate anikin
#
# cobra 0.29.1 is used by S11A only. S11B and S11C require cobra 0.26.0 and a
# separate environment: see environment/requirements_GEM.txt.
#
# kaleido 0.2.1 is the release compatible with plotly 5.x; it is needed for
# the PNG/SVG/PDF export in S17E (kaleido 1.x requires plotly >= 6.1.1).
#
# pymc and arviz are used by S14 only. The published S14 run was done in
# Google Colab; the versions below are tested to run S14 with this
# environment. arviz must stay below 1.0, which removed arguments S14 uses.

name: anikin

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.12
  - pandas=2.2.2
  - numpy=2.0.2
  - biopython=1.83
  - scikit-learn=1.6.1
  - scipy=1.18.0
  - matplotlib=3.10.0
  - seaborn=0.13.2
  - networkx=3.6.1
  - openpyxl=3.1.5
  - xlsxwriter=3.2.9
  - plotly=5.24.1
  - joblib=1.5.3
  - pyyaml=6.0.3
  - pip
  - pip:
      - kaleido==0.2.1
      - cobra==0.29.1
      - pymc==5.28.5
      - arviz==0.23.4