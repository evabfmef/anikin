# =============================================================================
# S18_environment.yml
#
# Pinned environment for S18_ML_classification.py.
#
# Fixed random seeds reproduce the published results only within the same
# scikit-learn version, so scikit-learn is pinned exactly. The other versions
# are those reported in Supplementary Methods 10.
#
# Create and check:
#   conda env create -f environment/S18_environment.yml
#   conda activate kd-s18
#   python environment/S18_verify_environment.py
# =============================================================================

name: kd-s18
channels:
  - conda-forge
dependencies:
  - python=3.12
  - scikit-learn=1.6.1
  - pandas=2.2.2
  - numpy=2.0.2
  - matplotlib=3.10.0
  - seaborn=0.13.2
  - joblib
  - openpyxl
